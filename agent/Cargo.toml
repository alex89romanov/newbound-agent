[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["dylib"]

[dependencies]
flowlang = { version="=0.3.34" }
ndata = "=0.3.17"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
ureq = { version = "2.9", features = ["json"] }

[features]
serde_support = ["serde","serde_json","flowlang/serde_support","ndata/serde_support"]
python_runtime = ["flowlang/python_runtime"]
default = []


# Self-contained: not a member of a host checkout's cargo workspace
# (upstream has no exclude list for the overlay paths).
[workspace]
