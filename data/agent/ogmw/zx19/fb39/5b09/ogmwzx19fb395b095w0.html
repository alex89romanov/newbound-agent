<!-- agentmodules — the agent add-on's ENTIRE plugin payload: ONE
     runtime/dev/plugins.json entry (target dev.dev) installs this
     cluster at boot, and it brings everything else itself. The module
     divs register the shared modules headless (each flagged
     `module: true`; api.js registers them on the page); the describebtn
     child arms the workbench's desc drafter (a document-level listener,
     no DOM of its own); and this control's js grafts the chat surface
     into the notebook's plugin slot whenever one appears. Nothing in
     the dev app names the agent; this control + one registry entry ARE
     the plugin. -->
<div class="data-control" data-control="agent:agentloop" hidden></div>
<div class="data-control" data-control="agent:agentprompt" hidden></div>
<div class="data-control" data-control="agent:memory" hidden></div>
<div class="data-control" data-control="agent:describebtn" hidden></div>
